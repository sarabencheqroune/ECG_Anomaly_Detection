# Model Configuration for ECG Anomaly Detection
# This file defines all model architecture and training parameters

# ============================================
# Model Architecture
# ============================================

model:
  type: hybrid  # Options: cnn, autoencoder, hybrid, lstm, transformer
  input_dim: 187
  num_classes: 5
  latent_dim: 32
  dropout: 0.2
  use_batch_norm: true
  
  # CNN Configuration (for CNN and hybrid models)
  cnn:
    conv_channels: [32, 64, 128]
    kernel_sizes: [5, 5, 3]
    strides: [1, 1, 1]
    padding: [2, 2, 1]  # 'same' padding
    pool_sizes: [2, 2, 2]
    pool_strides: [2, 2, 2]
  
  # Autoencoder Configuration
  autoencoder:
    encoder_layers: [187, 128, 64, 32]
    decoder_layers: [32, 64, 128, 187]
    activation: relu  # Options: relu, leaky_relu, elu, selu
    output_activation: linear
    use_dropout: true
    dropout_rate: 0.2
  
  # Hybrid Model Configuration
  hybrid:
    share_encoder: true
    fusion_type: concat  # Options: concat, add, weighted
    classification_weight: 0.7
    reconstruction_weight: 0.3
    contrastive_weight: 0.0
  
  # LSTM Configuration
  lstm:
    hidden_size: 128
    num_layers: 2
    bidirectional: true
    dropout: 0.3
    batch_first: true
  
  # Transformer Configuration
  transformer:
    d_model: 128
    nhead: 8
    num_encoder_layers: 4
    num_decoder_layers: 4
    dim_feedforward: 512
    dropout: 0.1
    activation: relu

# ============================================
# Data Configuration
# ============================================

data:
  # Preprocessing
  sampling_rate: 360
  beat_length: 187
  pre_window_ms: 100
  post_window_ms: 420
  
  # Filter parameters
  lowcut_hz: 0.5
  highcut_hz: 40.0
  notch_freq_hz: 50.0
  
  # Normalization
  normalize_method: zscore  # Options: zscore, minmax, robust
  
  # Data splitting
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  patient_wise: true
  random_seed: 42
  
  # Batching
  batch_size: 64
  num_workers: 4
  pin_memory: true
  
  # Augmentation
  use_augmentation: true
  augmentation_intensity: medium  # Options: light, medium, heavy
  augmentation_methods:
    - noise
    - baseline
    - time_warp
    - amplitude
    - electrode_shift
    - dropout
  
  # Class balancing
  balance_classes: true
  balancing_method: weighted  # Options: weighted, oversample, undersample

# ============================================
# Training Configuration
# ============================================

training:
  # Basic parameters
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  
  # Optimizer
  optimizer: adamw  # Options: adam, adamw, sgd, rmsprop
  momentum: 0.9  # For SGD
  
  # Learning rate scheduler
  scheduler: cosine  # Options: step, cosine, reduce_on_plateau, one_cycle, none
  scheduler_step_size: 30
  scheduler_gamma: 0.1
  scheduler_patience: 10
  scheduler_factor: 0.5
  scheduler_T_max: 100
  scheduler_eta_min: 1e-6
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 20
    monitor: val_loss
    mode: min
    min_delta: 0.0001
    restore_best_weights: true
  
  # Advanced training
  mixed_precision: true
  gradient_clip: 1.0
  gradient_accumulation_steps: 1
  label_smoothing: 0.05
  
  # Loss functions
  loss:
    # Classification loss
    classification: focal  # Options: cross_entropy, focal, weighted_ce
    focal_gamma: 2.0
    focal_alpha: null
    
    # Reconstruction loss
    reconstruction: mse  # Options: mse, mae, huber
    huber_delta: 1.0
    
    # Loss weights
    weights:
      classification: 1.0
      reconstruction: 0.5
      contrastive: 0.1
      sparsity: 0.01
      orthogonality: 0.001

# ============================================
# Inference Configuration
# ============================================

inference:
  # Thresholds
  confidence_threshold: 0.7
  anomaly_threshold: 0.5
  review_threshold: 0.7
  
  # Performance
  batch_size: 32
  device: auto  # Options: auto, cuda, cpu
  use_amp: true
  use_onnx: false
  
  # Caching
  cache_predictions: true
  max_cache_size: 1000
  
  # Calibration
  calibration:
    enabled: true
    method: temperature_scaling  # Options: temperature_scaling, isotonic_regression
    temperature_initial: 1.0
    validation_split: 0.1

# ============================================
# Human-in-the-Loop (HITL) Configuration
# ============================================

hitl:
  enabled: true
  confidence_threshold: 0.7
  
  # Queue management
  max_queue_size: 1000
  enable_escalation: true
  auto_skip_after_timeout: false
  
  # Timeouts (seconds)
  timeouts:
    critical: 300   # 5 minutes
    high: 3600      # 1 hour
    medium: 86400   # 24 hours
    low: 604800     # 7 days
  
  # Persistence
  persistence_enabled: true
  persistence_file: data/review_queue.json
  backup_interval_hours: 24
  
  # Redis (for distributed systems)
  use_redis: false
  redis_url: redis://localhost:6379/0
  
  # Active learning
  active_learning:
    enabled: true
    strategy: hybrid  # Options: uncertainty, margin, entropy, random, diversity, hybrid
    batch_size: 32
    uncertainty_threshold: 0.3
    diversity_weight: 0.3
    retraining_frequency_epochs: 5
    min_samples_for_retraining: 100
    max_training_samples: 10000

# ============================================
# Features Configuration
# ============================================

features:
  # RR interval features
  rr_intervals:
    enabled: true
    time_domain: true
    frequency_domain: true
    nonlinear: true
  
  # Wavelet features
  wavelet:
    enabled: true
    wavelet_type: db6  # Options: db4, db6, db8, sym5, coif3, bior3.5
    decomposition_level: 4
    features:
      - statistics
      - energy
      - entropy
  
  # Morphological features
  morphological:
    enabled: true
    features:
      - intervals
      - amplitudes
      - areas
      - slopes
  
  # Feature fusion
  fusion:
    method: concat  # Options: concat, weighted, attention
    feature_selection: true
    selection_method: mutual_info  # Options: anova, mutual_info, lasso
    n_selected_features: 50
    dimensionality_reduction: pca  # Options: pca, umap, none
    n_components: 30

# ============================================
# Evaluation Configuration
# ============================================

evaluation:
  # Metrics to compute
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - auc_roc
    - auc_pr
    - mcc
    - kappa
    - specificity
    - npv
  
  # Cross-validation
  cross_validation:
    enabled: false
    folds: 5
    stratified: true
    shuffle: true
  
  # Bootstrap confidence intervals
  bootstrap:
    enabled: true
    iterations: 1000
    confidence_level: 0.95
    parallel: true
  
  # Visualization
  visualization:
    save_plots: true
    plot_format: png
    dpi: 150
    show_confusion_matrix: true
    show_roc_curves: true
    show_calibration_curve: true

# ============================================
# Deployment Configuration
# ============================================

deployment:
  # Export formats
  export:
    torchscript: true
    onnx: true
    tensorrt: false
  
  # Optimization
  optimization:
    quantize: false
    prune: false
    distill: false
  
  # API Server
  api:
    host: 0.0.0.0
    port: 5000
    workers: 4
    timeout: 30
    max_requests: 1000
    max_requests_jitter: 100
  
  # Docker
  docker:
    image_name: ecg-anomaly-detection
    image_tag: latest
    dockerfile: Dockerfile
    port_mappings:
      - "5000:5000"

# ============================================
# Monitoring Configuration
# ============================================

monitoring:
  # Health checks
  health_check:
    enabled: true
    interval_seconds: 30
    endpoint: /health
  
  # Metrics collection
  metrics:
    enabled: true
    prometheus: false
    grafana: false
  
  # Alerting
  alerts:
    enabled: true
    channels:
      - console
      - file
    rules:
      - metric: inference_time_ms
        threshold: 100
        condition: greater_than
      - metric: error_rate
        threshold: 0.05
        condition: greater_than
      - metric: queue_size
        threshold: 100
        condition: greater_than

# ============================================
# Environment & Reproducibility
# ============================================

environment:
  seed: 42
  deterministic: true
  cuda_deterministic: true
  disable_cudnn_benchmark: true
  
  # Environment variables
  env_vars:
    OMP_NUM_THREADS: 4
    MKL_NUM_THREADS: 4
    CUDA_LAUNCH_BLOCKING: 1

# ============================================
# Version Information
# ============================================

version:
  config_version: 2.0.0
  last_updated: 2024-01-15
  author: ECG Anomaly Detection Team
  description: Production configuration for ECG anomaly detection system
  compatible_pytorch_version: ">=2.0.0"
  compatible_python_version: ">=3.9"